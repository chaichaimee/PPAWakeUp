summary = "PPA Tatip WakeUp ตาทิพย์จงตื่น!"
description = """PPAWakeUp ช่วยให้ PPA Tatip ทำงานร่วมกับ NVDA ได้อย่างราบรื่นโดยการกู้คืนอัตโนมัติเมื่อเกิดข้อผิดพลาดและจัดการเครื่องมือได้อย่างรวดเร็ว มีคุณสมบัติรีบูตอัตโนมัติเมื่อล้มเหลว การกรองคำพูดอักษร CJK เพื่อป้องกันอาการค้าง การป้องกันการขัดข้องของปุ่มในกล่องโต้ตอบ รวมถึงการสำรองข้อมูลพจนานุกรมในตัวและโปรแกรมแก้ไขพจนานุกรม

ปุ่มลัด:
Windows+P
กดครั้งเดียวเพื่อปลุก PPA Tatip
กดสองครั้งเพื่อแก้ไขพจนานุกรม PPA Tatip (userdict.txt)
กดสามครั้งเพื่อเปิดเมนูตาทิพย์ (สำรองและคืนค่าพจนานุกรมตาทิพย์และการตั้งค่าตัวเลือกเสียงตาทิพย์, การตั้งค่าเสียงตาทิพย์เริ่มต้นมาตรฐาน, เปิดตัวเลือกตาทิพย์, เปิดโฟลเดอร์ตาทิพย์)"""