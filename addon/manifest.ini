name = PPAWakeUp
summary = "PPA Tatip WakeUp ตาทิพย์จงตื่น!"
description = """PPAWakeUp ensures PPA Tatip runs smoothly with NVDA by automatically recovering from crashes and offering quick engine management. It features auto-reboot upon failure, CJK character speech filtering to prevent freezes, dialog button crash protection, and built-in dictionary backup and a dictionary editor.

Hot Keys:
Windows+P
Single Tap wake up  PPA Tatip
Double Tap Edit the PPA Tatip dictionary (userdict.txt)
Tripple Tap Open Tatip Menu (includes Open Tatip options)"""
author = "Chai Chaimee <chaicm75@gmail.com>"
